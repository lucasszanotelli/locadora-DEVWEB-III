spring.application.name=demo

# Banco SQLite salvo sempre em backend/demo/data/locadora.db
spring.datasource.url=jdbc:sqlite:data/locadora.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto necessario para o Hibernate gerar SQL compativel com SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQLite trabalha melhor com uma unica conexao de escrita
spring.datasource.hikari.maximum-pool-size=1
